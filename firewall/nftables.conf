#!/usr/sbin/nft -f

# Server firewall — policy: drop all inbound except
#   • loopback, established/related, ICMP
#   • the trusted WireGuard interface (everything from peers)
#   • explicitly listed public services (Caddy 80/443, WG UDP)

define wg_if     = "wg0"                # must match your wg interface name
define wg_port   = 51820                # must match ListenPort in /etc/wireguard/wg0.conf
define pub_ports = { http, https }      # Caddy

flush ruleset

table inet filter {

    chain input {
        type filter hook input priority filter; policy drop;

        # --- hygiene ------------------------------------------------------
        ct state invalid drop
        ct state established,related accept
        iif "lo" accept

        # --- ICMP ----------------------------------------------------------
        # v4: echo + errors (needed for PMTU discovery)
        icmp type { echo-request, destination-unreachable, \
                    time-exceeded, parameter-problem } accept
        # v6: neighbor discovery must be explicit — blocking this breaks SLAAC/DAD
        icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, \
                        parameter-problem } accept
        icmpv6 type { nd-neighbor-solicit, nd-neighbor-advertise, \
                        nd-router-solicit, nd-router-advertise } accept
        icmpv6 type echo-request accept

        # --- trusted network: WireGuard peers can reach anything ----------
        iif $wg_if counter accept

        # --- public services (these are what the router forwards) ----------
        tcp dport $pub_ports counter accept
        udp dport $wg_port counter accept      # WG endpoint — the one UDP port

        # --- SSH -----------------------------------------------------------
        # Wide open for now — restrict to wg0 or LAN once WireGuard is up.
        tcp dport 22 accept

        # log everything that's about to be dropped (rate-limited)
        log prefix "nft drop: " limit rate 1/second counter drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        # Only does anything if net.ipv4.ip_forward=1 AND WG peers route
        # traffic through this host (LAN access / VPN exit). Otherwise inert.
        ct state established,related accept

        # PMTU discovery for forwarded traffic — without these, IPv6
        # (and fragmented IPv4) can black-hole over the tunnel.
        icmp type destination-unreachable accept
        icmpv6 type packet-too-big accept

        iif $wg_if accept
        # oif $wg_if accept

        # MSS clamping for TCP through the tunnel (fixes MTU/mystery-hang issues)
        iif $wg_if tcp flags syn / syn tcp option maxseg size set rt mtu
        oif $wg_if tcp flags syn / syn tcp option maxseg size set rt mtu
    }

    chain output {
        type filter hook output priority filter; policy accept
    }
}
